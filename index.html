<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOREVIA — Building the Systems of Tomorrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#087F8C;
  --primary-dark:#075E68;
  --primary-light:#DDF5F4;
  --bg:#F2F8F8;
  --white:#FFFFFF;
  --surface:#F8FBFB;
  --border:#E3EEEE;
  --text:#102A2E;
  --text-soft:#617477;
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:10px;
  --font-en:'Manrope', sans-serif;
  --font-fa:'Vazirmatn', Tahoma, Arial, sans-serif;
  --max-w:1240px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-en);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{font-family:var(--font-fa);}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
.wrap{max-width:var(--max-w);margin:0 auto;padding-inline:24px;}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.01em;}
p{margin:0;}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}

/* ---------- reveal animation ---------- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease, transform .7s ease;}
.reveal.in{opacity:1;transform:translateY(0);}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(242,248,248,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding-block:18px;
}
.brand{font-size:20px;font-weight:800;letter-spacing:0.06em;color:var(--primary-dark);}
.nav-links{
  display:flex;gap:32px;align-items:center;
  font-size:14px;font-weight:600;color:var(--text-soft);
}
.nav-links a{transition:color .2s ease;}
.nav-links a:hover{color:var(--primary-dark);}
.nav-right{display:flex;align-items:center;gap:20px;}
.lang-switch{
  display:flex;gap:2px;background:var(--white);border:1px solid var(--border);
  border-radius:999px;padding:3px;font-size:13px;font-weight:700;
}
.lang-switch button{
  padding:7px 14px;border-radius:999px;color:var(--text-soft);transition:all .2s ease;
}
.lang-switch button.active{background:var(--primary);color:var(--white);}
.cta-btn{
  background:var(--primary-dark);color:var(--white);
  padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;
  letter-spacing:0.03em;transition:background .2s ease, transform .2s ease;
}
.cta-btn:hover{background:var(--primary);transform:translateY(-1px);}
.menu-toggle{display:none;font-size:22px;color:var(--primary-dark);}

@media (max-width:900px){
  .nav-links{display:none;}
  .menu-toggle{display:block;}
}

/* ---------- Hero ---------- */
.hero{padding-block:64px 40px;}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;}
.eyebrow{
  font-size:13px;font-weight:700;letter-spacing:0.08em;color:var(--primary);
  margin-bottom:18px;
}
.hero h1{font-size:clamp(36px,5vw,56px);line-height:1.08;color:var(--text);margin-bottom:22px;}
.hero p.desc{font-size:17px;color:var(--text-soft);max-width:480px;margin-bottom:32px;}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;}
.btn-primary{
  background:var(--primary-dark);color:var(--white);padding:14px 26px;
  border-radius:999px;font-size:14px;font-weight:700;transition:background .2s ease;
}
.btn-primary:hover{background:var(--primary);}
.btn-secondary{
  background:var(--white);border:1px solid var(--border);color:var(--text);
  padding:14px 26px;border-radius:999px;font-size:14px;font-weight:700;
  transition:border-color .2s ease;
}
.btn-secondary:hover{border-color:var(--primary);}
.hero-image{
  border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:6/7;
  background:var(--primary-light);
}
.hero-image img{width:100%;height:100%;object-fit:cover;}

@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;}
  .hero-image{order:-1;aspect-ratio:4/3;}
}

/* ---------- section basics ---------- */
section{padding-block:88px;}
.section-head{max-width:640px;margin-bottom:48px;}
.section-head h2{font-size:clamp(28px,3.4vw,38px);}

/* ---------- About ---------- */
.about-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:56px;align-items:center;}
.about-image{border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:5/6;background:var(--surface);}
.about-image img{width:100%;height:100%;object-fit:cover;}
.about-content p.desc{font-size:17px;color:var(--text-soft);margin-block:20px 28px;max-width:480px;}
.text-link{font-weight:700;color:var(--primary-dark);border-bottom:2px solid var(--primary);padding-bottom:2px;}
@media (max-width:900px){.about-grid{grid-template-columns:1fr;}}

/* ---------- Capabilities ---------- */
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.cap-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:32px 26px;transition:border-color .25s ease, transform .25s ease;
}
.cap-card:hover{border-color:var(--primary);transform:translateY(-4px);}
.cap-card .num{font-size:13px;color:var(--text-soft);font-weight:600;margin-bottom:18px;}
.cap-card h3{font-size:19px;margin-bottom:10px;}
.cap-card p{font-size:14.5px;color:var(--text-soft);}
@media (max-width:900px){.cap-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:600px){.cap-grid{grid-template-columns:1fr;}}

/* ---------- Featured project ---------- */
.featured{
  background:var(--primary-dark);border-radius:var(--radius-lg);
  padding:56px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;
  color:var(--white);
}
.featured-image{border-radius:var(--radius-md);overflow:hidden;aspect-ratio:5/4;}
.featured-image img{width:100%;height:100%;object-fit:cover;}
.featured .tag{
  font-size:12px;font-weight:700;letter-spacing:0.06em;color:var(--primary-light);
  background:rgba(255,255,255,0.12);display:inline-block;padding:6px 14px;border-radius:999px;
  margin-bottom:18px;
}
.featured h3{font-size:clamp(24px,3vw,32px);margin-bottom:16px;}
.featured p.desc{color:rgba(255,255,255,0.78);font-size:16px;margin-bottom:28px;max-width:420px;}
.featured .btn-primary{background:var(--white);color:var(--primary-dark);}
.featured .btn-primary:hover{background:var(--primary-light);}
@media (max-width:900px){.featured{grid-template-columns:1fr;padding:32px;}}

/* ---------- Projects ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.proj-card{
  border-radius:var(--radius-md);overflow:hidden;background:var(--white);
  border:1px solid var(--border);transition:transform .25s ease;
}
.proj-card:hover{transform:translateY(-4px);}
.proj-image{aspect-ratio:4/3;overflow:hidden;}
.proj-image img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.proj-card:hover .proj-image img{transform:scale(1.05);}
.proj-body{padding:20px 22px 24px;}
.proj-cat{font-size:12px;color:var(--primary-dark);font-weight:700;margin-bottom:8px;}
.proj-body h3{font-size:17px;}
@media (max-width:900px){.proj-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:600px){.proj-grid{grid-template-columns:1fr;}}

/* ---------- Expertise ---------- */
.expertise-wrap{display:grid;grid-template-columns:0.9fr 1.1fr;gap:56px;}
.expertise-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.expertise-item{
  border:1px solid var(--border);background:var(--white);border-radius:var(--radius-sm);
  padding:18px 20px;font-weight:600;font-size:15px;
}
@media (max-width:900px){.expertise-wrap{grid-template-columns:1fr;}.expertise-list{grid-template-columns:1fr;}}

/* ---------- Innovation ---------- */
.innovation{
  background:var(--surface);border-radius:var(--radius-lg);padding:64px;
  text-align:center;
}
.innovation .section-head{margin-inline:auto;text-align:center;}
html[dir="rtl"] .innovation .section-head{text-align:center;}
@media (max-width:700px){.innovation{padding:36px 24px;}}

/* ---------- Global presence ---------- */
.global-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;}
.map-box{
  aspect-ratio:4/3;background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;
  color:var(--text-soft);font-size:14px;font-weight:600;
}
@media (max-width:900px){.global-grid{grid-template-columns:1fr;}}

/* ---------- Process ---------- */
.process-list{display:flex;flex-direction:column;}
.process-item{
  display:grid;grid-template-columns:80px 1fr;gap:24px;padding-block:24px;
  border-top:1px solid var(--border);
}
.process-item:last-child{border-bottom:1px solid var(--border);}
.process-item .num{font-size:15px;font-weight:700;color:var(--primary);}
.process-item h3{font-size:18px;margin-bottom:6px;}
.process-item p{color:var(--text-soft);font-size:14.5px;}

/* ---------- Numbers ---------- */
.numbers-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
.number-card{text-align:center;padding:28px 10px;}
.number-card .big{font-size:clamp(32px,4.5vw,44px);font-weight:800;color:var(--primary-dark);}
.number-card .label{font-size:13.5px;color:var(--text-soft);margin-top:6px;}
.numbers-note{margin-top:28px;font-size:13px;color:var(--text-soft);text-align:center;}
@media (max-width:700px){.numbers-grid{grid-template-columns:1fr 1fr;}}

/* ---------- Sustainability ---------- */
.sustain-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;}
.sustain-image{border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:6/5;}
.sustain-image img{width:100%;height:100%;object-fit:cover;}
@media (max-width:900px){.sustain-grid{grid-template-columns:1fr;}.sustain-image{order:-1;}}

/* ---------- Final CTA ---------- */
.final-cta{
  background:var(--primary-dark);border-radius:var(--radius-lg);
  padding:72px 40px;text-align:center;color:var(--white);
}
.final-cta h2{font-size:clamp(28px,4vw,42px);margin-bottom:14px;}
.final-cta p{color:rgba(255,255,255,0.78);margin-bottom:32px;font-size:16px;}
.final-cta .btn-primary{background:var(--white);color:var(--primary-dark);}
.final-cta .btn-primary:hover{background:var(--primary-light);}

/* ---------- Contact ---------- */
.contact-grid{display:grid;grid-template-columns:0.8fr 1.2fr;gap:56px;}
.contact-info h2{font-size:clamp(26px,3.4vw,34px);margin-bottom:20px;}
.contact-info p{color:var(--text-soft);}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
form .full{grid-column:1 / -1;}
label{font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px;display:block;}
input,textarea{
  width:100%;border:1px solid var(--border);background:var(--white);
  border-radius:var(--radius-sm);padding:13px 16px;font-size:15px;font-family:inherit;
  color:var(--text);transition:border-color .2s ease;
}
input:focus,textarea:focus{outline:none;border-color:var(--primary);}
textarea{resize:vertical;min-height:120px;}
.field-error{color:#B84545;font-size:12.5px;margin-top:6px;display:none;}
.form-success{
  display:none;background:var(--primary-light);color:var(--primary-dark);
  padding:14px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;margin-top:6px;
}
@media (max-width:800px){.contact-grid{grid-template-columns:1fr;}form{grid-template-columns:1fr;}}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--border);padding-block:48px;}
.footer-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:32px;}
.footer-brand .brand{margin-bottom:10px;}
.footer-brand .tag{font-size:13px;color:var(--primary-dark);font-weight:700;letter-spacing:0.04em;margin-bottom:6px;}
.footer-brand .claim{font-size:14px;color:var(--text-soft);}
.footer-links{display:flex;gap:28px;flex-wrap:wrap;font-size:14px;color:var(--text-soft);font-weight:600;}
.footer-links a:hover{color:var(--primary-dark);}

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--primary-dark);outline-offset:2px;
}
</style>
</head>

function get(obj, path){
  return path.split('.').reduce((o,k)=>(o && o[k]!==undefined)? o[k] : null, obj);
}

function renderStatic(lang){
  const dict = T[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const val = get(dict, el.getAttribute('data-i18n'));
    if(val !== null) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const val = get(dict, el.getAttribute('data-i18n-placeholder'));
    if(val !== null) el.setAttribute('placeholder', val);
  });
}

function renderDynamic(lang){
  const dict = T[lang];

  const capGrid = document.getElementById('cap-grid');
  capGrid.innerHTML = dict.capabilities.items.map((it,i)=>`
    <div class="cap-card reveal in">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <h3>${it.t}</h3>
      <p>${it.d}</p>
    </div>`).join('');

  const projGrid = document.getElementById('proj-grid');
  projGrid.innerHTML = dict.projects.items.map(it=>`
    <div class="proj-card reveal in">
      <div class="proj-image"><img src="${it.img}" alt=""></div>
      <div class="proj-body">
        <div class="proj-cat">${it.c}</div>
        <h3>${it.t}</h3>
      </div>
    </div>`).join('');

  const expList = document.getElementById('expertise-list');
  expList.innerHTML = dict.expertise.items.map(it=>`<div class="expertise-item">${it}</div>`).join('');

  const procList = document.getElementById('process-list');
  procList.innerHTML = dict.process.items.map(it=>`
    <div class="process-item">
      <div class="num">${it.n}</div>
      <div><h3>${it.t}</h3><p>${it.d}</p></div>
    </div>`).join('');

  const numGrid = document.getElementById('numbers-grid');
  numGrid.innerHTML = dict.numbers.items.map(it=>`
    <div class="number-card reveal in">
      <div class="big">${it.big}</div>
      <div class="label">${it.label}</div>
    </div>`).join('');
}

function setLanguage(lang){
  const html = document.documentElement;
  html.setAttribute('lang', lang);
  html.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-lang-btn]').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang-btn') === lang);
  });
  renderStatic(lang);
  renderDynamic(lang);
  clearFormErrors();
  localStorage.setItem('norevia-lang', lang);
}

document.querySelectorAll('[data-lang-btn]').forEach(btn=>{
  btn.addEventListener('click', ()=> setLanguage(btn.getAttribute('data-lang-btn')));
});

/* contact form validation */
function clearFormErrors(){
  document.querySelectorAll('.field-error').forEach(el=>{el.style.display='none';el.textContent='';});
  document.getElementById('form-success').style.display='none';
}

document.getElementById('contact-form').addEventListener('submit', function(e){
  e.preventDefault();
  const lang = document.documentElement.getAttribute('lang');
  const dict = T[lang];
  const data = new FormData(this);
  let valid = true;
  clearFormErrors();

  const name = (data.get('name')||'').trim();
  const email = (data.get('email')||'').trim();
  const message = (data.get('message')||'').trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  if(!name){ showError('name', dict.contact.errors.name); valid=false; }
  if(!emailOk){ showError('email', dict.contact.errors.email); valid=false; }
  if(!message){ showError('message', dict.contact.errors.message); valid=false; }

  if(valid){
    document.getElementById('form-success').style.display='block';
    this.reset();
  }
});

function showError(field, msg){
  const el = document.querySelector(`[data-error="${field}"]`);
  if(el){ el.textContent = msg; el.style.display='block'; }
}

/* scroll reveal */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting) entry.target.classList.add('in');
  });
}, {threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

/* init */
const savedLang = localStorage.getItem('norevia-lang');
const initialLang = (savedLang === 'en' || savedLang === 'fa') ? savedLang : 'en';
setLanguage(initialLang);
</script>
